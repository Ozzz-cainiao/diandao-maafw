name: Validate and build preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch_dependencies.py
      - run: python -m unittest discover -s tests -v
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: diandao-experimental-debug
          path: artifacts/*.apk
